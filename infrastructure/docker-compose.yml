# =============================================================================
# Open Insight — môi trường dev
#
# PROFILES: 6 container không thể cùng chạy thoải mái trên laptop, nên chỉ bật
# phần nào đang cần.
#
#   (không profile)  mysql, redis                -> LUÔN chạy
#   data             minio, minio-init, clickhouse
#   bi               cube  (+ clickhouse)
#
#   docker compose up -d                          # chỉ service lõi
#   docker compose --profile data up -d           # + MinIO, ClickHouse
#   docker compose --profile bi   up -d           # + Cube (kéo theo ClickHouse)
#   docker compose --profile data --profile bi up -d
#
# Service lõi CỐ Ý không gán profile: service không có `profiles:` thì luôn
# khởi động, kể cả khi bật profile khác. Nhờ vậy `docker compose up -d` và
# start-dev.sh giữ nguyên hành vi cũ — nếu gán chúng vào profile "core" thì
# lệnh up không kèm cờ sẽ lặng lẽ không khởi động gì cả.
#
# clickhouse gán HAI profile vì cube phụ thuộc nó. Service liệt kê nhiều profile
# sẽ chạy khi BẤT KỲ profile nào trong đó được bật, tránh lỗi "depends on
# service which is not enabled".
#
# ─── Kafka, Debezium Connect và dbt đã được GỠ ──────────────────────────────
#
# Ba service đó từng nằm ở đây dưới profile `stream` và `tools`, nhưng chưa bao
# giờ được nối vào ứng dụng: không có `kafkajs` trong dependency, không có file
# cấu hình connector nào cho Debezium, và `infrastructure/dbt/` không có model
# nào nên `dbt run` compile ra số không. Giữ chúng lại chỉ tạo ấn tượng sai rằng
# CDC và tầng biến đổi dữ liệu đang hoạt động.
#
# Chúng vẫn nằm trong "Kiến trúc mục tiêu" ở README. Khi nào thật sự làm §F10
# thì dựng lại từ lịch sử git — commit gỡ chúng có đủ cấu hình cũ.
#
# TAG: mọi image đều pin phiên bản cụ thể, KHÔNG dùng :latest — hai máy pull ở
# hai thời điểm khác nhau sẽ ra hai bản khác nhau, và lỗi kiểu đó rất khó tìm.
# =============================================================================

services:
  # ===========================================================================
  # LÕI — luôn chạy
  # ===========================================================================

  mysql:
    image: mysql:8.0
    container_name: bi-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bi_platform}
      MYSQL_USER: ${MYSQL_USER:-bi_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bi_password}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - bi-network

  redis:
    image: redis:7-alpine
    container_name: bi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - bi-network

  # ===========================================================================
  # DATA — object storage + kho phân tích        (--profile data)
  # ===========================================================================

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bi-minio
    profiles: ["data"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MINIO_API_PORT:-9000}:9000"       # API — @aws-sdk/client-s3 gọi vào đây
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # Giao diện web quản trị
    volumes:
      - minio_data:/data
    healthcheck:
      # Image MinIO đã kèm sẵn mc, không cần curl/wget
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - bi-network

  # Chạy một lần để tạo bucket rồi thoát. restart:"no" để không bị khởi động lại
  # vô hạn sau khi hoàn thành.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: bi-minio-init
    profiles: ["data"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      BI_BUCKET: ${S3_BUCKET:-bi-datasets}
    entrypoint: ["/bin/sh", "/scripts/init-bucket.sh"]
    volumes:
      - ./minio:/scripts:ro
    networks:
      - bi-network

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: bi-clickhouse
    # HAI profile: cube (bi) phụ thuộc ClickHouse. Không khai đủ ở đây thì
    # `--profile bi` một mình sẽ lỗi phụ thuộc.
    profiles: ["data", "bi"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-bi_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-bi_user}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"     # HTTP — @clickhouse/client và Cube dùng cổng này
      - "${CLICKHOUSE_NATIVE_PORT:-9002}:9000"   # Native — mặc định 9000 ĐỤNG MinIO, nên map ra 9002
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Mount TỪNG FILE, tuyệt đối không mount cả thư mục config.d / users.d.
      #
      # Entrypoint của image cần tự ghi hai file vào chính hai thư mục đó:
      #   config.d/docker_related_config.xml -> bật <listen_host> để ClickHouse
      #     nghe trên mọi interface. Thiếu file này nó chỉ nghe 127.0.0.1 và
      #     container khác (Cube) nhận ECONNREFUSED.
      #   users.d/default-user.xml -> tạo user từ CLICKHOUSE_USER/PASSWORD.
      #
      # Mount cả thư mục dạng :ro sẽ chặn cả hai. Hỏng kiểu này rất khó đoán:
      # container vẫn "healthy" (healthcheck chạy từ bên trong qua localhost)
      # nhưng mọi service khác không kết nối được.
      - ./clickhouse/config.d/low-mem.xml:/etc/clickhouse-server/config.d/low-mem.xml:ro
      - ./clickhouse/users.d/limits.xml:/etc/clickhouse-server/users.d/limits.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - bi-network

  # ===========================================================================
  # BI — tầng ngữ nghĩa                          (--profile bi)
  # ===========================================================================

  cube:
    image: cubejs/cube:v1.7.16
    container_name: bi-cube
    profiles: ["bi"]
    restart: unless-stopped
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse       # tên service, không phải localhost
      CUBEJS_DB_PORT: 8123             # cổng HTTP của ClickHouse
      CUBEJS_DB_NAME: ${CLICKHOUSE_DB:-bi_analytics}
      CUBEJS_DB_USER: ${CLICKHOUSE_USER:-bi_user}
      CUBEJS_DB_PASS: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
      # Secret này để Express ký JWT ngắn hạn mang securityContext ở F7.
      # Cube TUYỆT ĐỐI không được expose thẳng ra trình duyệt.
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-cube-api-secret-change-me}
      # Đồng hồ Windows và đồng hồ máy ảo Docker trôi xa nhau sau mỗi lần máy
      # ngủ. 300 giây là dung sai cho việc đó — xem CLOCK_TOLERANCE trong
      # cube/cube.js để biết vì sao nới ra không phải là hạ tiêu chuẩn an toàn.
      CUBEJS_CLOCK_TOLERANCE: ${CUBEJS_CLOCK_TOLERANCE:-300}
      # ⚠️ ĐÃ THỬ và ĐÃ BỎ: `CUBEJS_CONCURRENCY: 12`.
      #
      # Giả thuyết là 12 ô của một khung xếp hàng sau trần đồng thời của driver
      # ClickHouse. Đo lại sau khi đặt: `GET /reports/:id/canvas-data` giữ nguyên
      # trung vị 162ms — không đổi một chút nào. Phép đo dẫn tới giả thuyết đó
      # gọi `report-preview` 12 lần, mà đường ấy nạp lại chỉ mục mô hình cho mỗi
      # lần gọi; thứ đo được là hàng đợi POOL MYSQL, không phải hàng đợi Cube.
      #
      # Chỗ thắt thật đã được gỡ ở tầng ứng dụng (§10.14): nạp chỉ mục MỘT lần
      # cho cả khung. Đừng đặt lại biến này nếu chưa đo được nó làm gì.
      CUBEJS_LOG_LEVEL: info
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${CUBEJS_PORT:-4100}:4000"    # Cube mặc định 4000 — ĐỤNG Express, nên map ra 4100
    volumes:
      # Express sinh file schema vào ./cube/model/tenants/<tenantId>/ — xem
      # CUBE_SCHEMA_DIR ở backend và repositoryFactory trong cube.js. KHÔNG phải
      # ./cube/model/cubes/: cube.js không đọc thư mục đó, file đặt nhầm vào đấy
      # sẽ nằm im không ai báo lỗi.
      - ./cube:/cube/conf
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      # Image Cube dựa trên Node, không có curl — dùng chính node để gọi HTTP
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:4000/readyz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - bi-network

volumes:
  mysql_data:
  redis_data:
  minio_data:
  clickhouse_data:

networks:
  bi-network:
    driver: bridge
