services:
  mysql:
    image: mysql:8.0
    container_name: bi-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bi_platform}
      MYSQL_USER: ${MYSQL_USER:-bi_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bi_password}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bi-network

  redis:
    image: redis:7-alpine
    container_name: bi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bi-network

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: bi-keycloak
    restart: unless-stopped
    # start-dev: chế độ dev (HTTP, không cần TLS, không cache cluster).
    # --import-realm: import mọi file .json trong /opt/keycloak/data/import lúc khởi động.
    command: ["start-dev", "--import-realm"]
    environment:
      # --- Tài khoản quản trị Keycloak (master realm) ---
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}

      # --- Kết nối MySQL (dùng chung container mysql, database riêng) ---
      KC_DB: mysql
      KC_DB_URL_HOST: mysql          # tên service trong network, KHÔNG phải localhost
      KC_DB_URL_PORT: 3306           # port nội bộ container, không phải port map ra host
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      KC_DB_URL_PROPERTIES: "?characterEncoding=UTF-8&connectionTimeZone=UTC"
      KC_TRANSACTION_XA_ENABLED: "false"

      # --- HTTP / hostname (chỉ hợp lệ cho môi trường dev) ---
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      # --- Endpoint /health/* và /metrics ---
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      mysql:
        condition: service_healthy   # chờ MySQL healthy rồi mới khởi động
    healthcheck:
      # Image Keycloak không có curl/wget, dùng /dev/tcp của bash để gọi HTTP
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q 'UP'",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - bi-network

volumes:
  mysql_data:
  redis_data:

networks:
  bi-network:
    driver: bridge
