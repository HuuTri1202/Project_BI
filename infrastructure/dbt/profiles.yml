# Kết nối dbt -> ClickHouse.
#
# Mọi giá trị lấy từ biến môi trường (docker-compose.yml truyền vào) để file này
# commit được mà không lộ mật khẩu.
bi_platform:
  target: dev
  outputs:
    dev:
      type: clickhouse
      # Tên service trong bi-network, KHÔNG phải localhost.
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      # 8123 = HTTP. Cổng native (9000 trong container) dành cho clickhouse-client.
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'bi_user') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'clickhouse_password') }}"
      schema: "{{ env_var('CLICKHOUSE_DB', 'bi_analytics') }}"
      driver: http
      secure: False
      verify: False
      # Chạy tuần tự cho nhẹ máy dev; tăng lên khi cần ở F6.
      threads: 1
      connect_timeout: 10
      send_receive_timeout: 300
