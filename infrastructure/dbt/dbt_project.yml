name: bi_platform
version: 1.0.0
config-version: 2

# Trỏ tới khối outputs trong profiles.yml
profile: bi_platform

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: target
clean-targets:
  - target
  - dbt_packages

models:
  bi_platform:
    # staging = view mỏng trên bảng raw_* do backend nạp vào.
    # Chỉ chuẩn hoá tên cột và ép kiểu, KHÔNG tính toán nghiệp vụ.
    staging:
      +materialized: view
      +schema: staging

    # marts = bảng thật, đã tổng hợp. ĐÂY là nơi DataModel/Cube trỏ tới.
    #
    # Chính một quyết định nối dây này phân biệt "dự án có dùng dbt" với
    # "dự án dùng dbt có lý do": nếu Cube đọc thẳng raw_* thì dbt chỉ là
    # trang trí.
    marts:
      +materialized: table
      +schema: marts
